name: Build release binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-ubuntu-x86_64:
    name: Ubuntu x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Rust stable
        run: rustup default stable

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/rustclipsync dist/rustclipsync-ubuntu-x86_64
          chmod +x dist/rustclipsync-ubuntu-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustclipsync-ubuntu-x86_64
          path: dist/rustclipsync-ubuntu-x86_64
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-ubuntu-x86_64
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --name rustclipsync-ubuntu-x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          tag="build-${short_sha}"
          title="Build ${short_sha}"
          notes="Automated x86_64 build for commit ${GITHUB_SHA}."
          ubuntu_asset="$(find release-assets -type f -name rustclipsync-ubuntu-x86_64 -print -quit)"

          if [ -z "$ubuntu_asset" ]; then
            echo "Ubuntu artifact not found under release-assets"
            find release-assets -maxdepth 3 -type f -print
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ubuntu_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" "$ubuntu_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
