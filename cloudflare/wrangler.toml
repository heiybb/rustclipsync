name = "rustclipsync-relay"
main = "src/index.ts"
compatibility_date = "2026-05-11"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "rustclipsync-objects"

[observability.logs]
enabled = true
invocation_logs = true
