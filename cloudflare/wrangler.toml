name = "rustclipsync-relay"
main = "src/index.ts"
compatibility_date = "2026-05-11"
# No public *.workers.dev or preview URL. The custom domain is not kept in this
# file; pass it at deploy time: `wrangler deploy --domain relay.example.com`.
# Deploying without --domain leaves the Worker with no reachable address.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "rustclipsync-objects"

[observability.logs]
enabled = true
invocation_logs = true
